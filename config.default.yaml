# Global configuration for the lecture cleanup pipeline
# You can override most of these via CLI flags in run_pipeline.py

# Native YouTube subtitle selection (both subtitle download entry points).
# CLI overrides these values; config.yaml overrides this default file.
autoyoutube:
  lang: auto                 # Original audio language; or an explicit code such as en/de-CH
  subtitle_source: auto      # auto | manual | prefer-manual; never auto-translated tracks

language: ru            # two-letter ISO-639-1 code; e.g. ru, uk, en, de, pl, es

# LLM settings (provider-aware). Configure provider and per-provider settings here.
llm:
  provider: gemini      # openai | gemini | kie | evolink | groq | deepseek | dummy | ...
  # Kie.ai usage example:
  # - set `provider: kie`
  # - put `KIE_API_KEY=...` into `.env`
  # - choose a Kie model slug in `llm.kie.model` (examples below)
  # The Kie adapter calls: https://api.kie.ai/<model>/v1/chat/completions
  # Groq usage example:
  # - set provider: groq
  # - put GROQ_API_KEY=... into .env
  # - choose a Groq model slug in llm.groq.model (examples below)
  # The Groq adapter calls: https://api.groq.com/openai/v1/chat/completions
  # DeepSeek usage example:
  # - set provider: deepseek
  # - put DEEPSEEK_API_KEY=... into .env
  # - choose a DeepSeek model slug in llm.deepseek.model (examples below)
  # The DeepSeek adapter calls: https://api.deepseek.com/chat/completions
  # Optional delay (seconds) between consecutive LLM requests (chunks and summary).
  # Helps to avoid provider rate limits. 0 disables. CLI flag: --request-delay
  request_delay_seconds: 120
  openai:
    model: gpt-5-mini          # choose your model, e.g., gpt-5, gpt-5-mini, gpt-5-nano, gpt-5.1 / gpt-4.1 / o4-mini https://platform.openai.com/docs/models
    temperature: 1
    top_p: 1.0
    # Retry settings specific to OpenAI (override global defaults below).
    retry:
      attempts: 2        # 1 = no retry, 2..N = number of attempts per request
      pause_seconds: 10.0 # extra pause added to provider-suggested retry delay; if none, used alone
  gemini:
    model: gemini-3-flash-preview   # model like: gemini-2.5-pro, gemini-2.5-flash, gemini-2.5-flash-lite https://ai.google.dev/gemini-api/docs/models
    temperature: 1
    top_p: 1.0
    # Retry settings specific to Gemini (override global defaults below).
    retry:
      attempts: 3        # 1 = no retry, 2..N = number of attempts per request
      pause_seconds: 60.0 # extra pause added to provider-suggested retry delay; if none, used alone
  kie:
    model: gemini-2.5-pro   # Kie Gemini text model slug (ready to use). Alternative: gemini-3-pro
    # The adapter automatically builds the Kie endpoint from this model name:
    # https://api.kie.ai/<model>/v1/chat/completions
    # Examples tested by Kie docs: gemini-2.5-pro, gemini-3-pro
    temperature: 1
    top_p: 1.0
    # Retry settings specific to Kie (override global defaults below).
    retry:
      attempts: 3        # 1 = no retry, 2..N = number of attempts per request
      pause_seconds: 60.0 # extra pause added to provider-suggested retry delay; if none, used alone
  evolink:
    # EvoLink Gemini Native API (Google Native API format).
    # Default/reference quickstart:
    # https://docs.evolink.ai/en/api-manual/language-series/gemini-2.5-pro/native-api/native-api-quickstart
    model: gemini-2.5-pro
    method: generateContent   # path suffix in native endpoint: /v1beta/models/<model>:generateContent
    api_base_url: https://api.evolink.ai   # usually keep default
    temperature: 1
    top_p: 1.0
    # Retry settings specific to EvoLink (override global defaults below).
    retry:
      attempts: 3        # 1 = no retry, 2..N = number of attempts per request
      pause_seconds: 60.0 # extra pause added to provider-suggested retry delay; if none, used alone
  groq:
    # Groq OpenAI-compatible Chat Completions API.
    # Default/reference docs: https://console.groq.com/docs/openai
    # Examples:
    # - openai/gpt-oss-120b: supports reasoning_effort low|medium|high.
    # - qwen/qwen3.6-27b: supports reasoning_effort default|none.
    model: openai/gpt-oss-120b
    api_base_url: https://api.groq.com/openai/v1   # usually keep default
    # For transcript cleanup, keep output stable and hide reasoning from final Markdown.
    temperature: 0.3
    top_p: 1.0
    reasoning_effort: medium # low medium high
    reasoning_format: hidden
    # Alternative for Qwen 3.6 27B thinking mode:
    # model: qwen/qwen3.6-27b
    # temperature: 0.6
    # top_p: 0.95
    # reasoning_effort: default # none or default
    # reasoning_format: hidden
    # Retry settings specific to Groq (override global defaults below).
    retry:
      attempts: 3        # 1 = no retry, 2..N = number of attempts per request
      pause_seconds: 60.0 # extra pause added to provider-suggested retry delay; if none, used alone
  deepseek:
    # DeepSeek OpenAI-compatible Chat Completions API.
    # Official docs: https://api-docs.deepseek.com/
    #
    # Default block: reasoning-first cleanup.
    # Use this when quality and instruction-following matter more than speed/cost.
    # Thinking mode does NOT support temperature/top_p; do not add them here.
    model: deepseek-v4-pro
    api_base_url: https://api.deepseek.com   # usually keep default
    thinking: enabled          # enabled | disabled
    reasoning_effort: high     # high | max (reasoning for thinking)
    #
    # Alternative block: faster/cheaper non-thinking cleanup.
    # Copy this whole block to config.yaml if you want temperature/top_p control.
    # DeepSeek recommends changing either temperature OR top_p, not both:
    # - temperature: 0..2. Lower values like 0.2 are more focused/deterministic;
    #   higher values like 0.8 are more random. For transcript cleanup, try 0.2-0.4.
    # - top_p: 0..1 nucleus sampling. Lower values are more restrictive; keep 1.0
    #   unless you deliberately tune top_p instead of temperature.
    # model: deepseek-v4-flash
    # api_base_url: https://api.deepseek.com
    # thinking: disabled
    # temperature: 0.3
    # top_p: 1.0
    # Retry settings specific to DeepSeek (override global defaults below).
    retry:
      attempts: 3        # 1 = no retry, 2..N = number of attempts per request
      pause_seconds: 60.0 # extra pause added to provider-suggested retry delay; if none, used alone

# Global LLM API retry defaults (used if llm.<provider>.retry.* not provided). CLI --retry-attempts overrides attempts.
retry:
  attempts: 2        # 1 = no retry
  pause_seconds: 60.0 # extra pause added to provider-suggested retry delay; if none, used alone

# Input format control. When set, overrides auto-detection by file extension.
# One of: srt(VIP), txt (CLI --format still overrides this if provided)
format: txt

# Chunking
txt_chunk_chars: 6500   # chunk size for plain text (TXT)
rebalance_small_tail_chunks: true # if exactly 2 chunks and the second is <30% of txt_chunk_chars, rebalance near 50/50

# Overlap-specific options (advanced)
## Overlap typ
use_context_overlap: cleaned              # one of: raw, cleaned, none (backward-compatible with true/false)

## Number of characters from the END of the previous chunk passed to the model as READ-ONLY CONTEXT.
## Improves continuity; not included in output. Typical: 300–800 (0 = off).
txt_overlap_chars: 500  # overlap for plain text (TXT)

## Overlap sentence delimiters
overlap_sentence_delimiters: ".!?…"   # characters that mark end of sentences for tail selection

# Join-time window (in characters) used to remove any DUPLICATED prefix from the next chunk’s output.
# Usually set equal to txt_overlap_chars; increase if you still see duplicates.
# Try null, but can be completely disabled by setting 0
stitch_dedup_window_chars: null        # if null, defaults to txt_overlap_chars

# Output / behavior
# Timestamp/reference formats for generated headings
include_timecodes_in_headings: true          # I: [HH:MM:SS] in the heading
include_timecodes_below_headings: false      # B: [🎥 HH:MM:SS](...) below the heading
include_src_block_ids: false                 # S: ^src-SECONDS
include_txt_block_ids_for_untimed: false     # ^txt-N only when no timestamp is resolved
# Assignment strategy for timestamped input. The LLM always emits canonical I;
# the requested I/B/S formats are rendered programmatically afterward.
process_timecodes_by_ai: true
# QC report output:
# - outdir         : write next to the .md output (current behavior)
# - default_outdir : always write to ./output regardless of --outdir
# - off            : do not create a QC report
qc_report_mode: "off"

# Content optimization mode:
# Provide file name relative to prompts/system_ (without .md).
#
# Predefined modes:
# - strict: no reordering; only punctuation/casing; removes safe fillers.
# - normal: balanced cleanup that preserves meaning and adds light structure.
# - creative: stronger rephrasing and sentence merging; normalizes term variants (tracked default).
# - creativedetailed: creative cleanup that preserves verbosity, tone, and small interjections.
# - creativeeditoral: detailed cleanup with richer Markdown structure and editorial callouts.
# - creativeeditoral_technical: editorial cleanup with technical formatting and technical callouts.
content_mode: creative

# Edit comments emitted at end of each output block (HTML comments like <!-- fixed: ... -->, <!-- merged_terms: ... -->).
# If true, these comments are removed from the final Markdown (still accounted internally by the model).
suppress_edit_comments: false

# Visual style for asides/jokes in the output.
# Allowed values:
# - italic      -> render as italics (*...*)
# - blockquote  -> render as blockquote (> ...)
highlight_asides_style: italic

#############################
# !!!      Warning      !!! #
# High token usage          #
############################# 
# The full result Markdown is sent to the model to produce enabled summaries.
# When both types are enabled, they are generated in one optimized LLM request.
summary:
  short:
    enabled: false
    heading: "## 🔎 Summary (не авторський)"
    # default follows --lang; otherwise use a two-letter ISO-639-1 code.
    lang: default
    output: append                    # append | separate
    # Used only for separate output: <filename><file_suffix>.md.
    # Must be non-empty and must not contain a path separator.
    file_suffix: "-summary"

  long:
    enabled: false
    heading: "## 📝 Long summary (не авторський)"
    # default follows --lang; otherwise use a two-letter ISO-639-1 code.
    lang: default
    output: append                    # append | separate
    # Used only for separate output: <filename><file_suffix>.md.
    # Must be non-empty and must not contain a path separator.
    file_suffix: "-longsummary"
    references:
      # Add a compact source link below every generated ### and #### heading.
      # Requires both include_src_block_ids and
      # include_txt_block_ids_for_untimed to be true in the effective config.
      enabled: false
      # markdown renders as a link in standard Markdown viewers, but the
      # #^src-* / #^txt-* block target remains Obsidian-specific.
      link_style: markdown            # markdown | wikilink
      # Reference aliases are rendered programmatically after AI validation.
      display:
        label: "🔗 Source"
        heading: none                 # none | title | markdown
        timestamp: true
        separator: " · "

# Additional/regenerated summaries of existing Markdown: StartMe.sh add-summary.
# This section has no effect on lecture_cleanup.sh or transcription workflows.
# For add-summary only, short/long recursively override summary.short/long.
# Missing keys, empty mappings, and null values inherit summary settings.
# Explicit false is an override. CLI options take precedence over both sections.
summary_regeneration:
  # Optional short overrides (the same keys and validation as summary.short):
  # enabled: whether short is selected without --type.
  # heading: the outer Markdown heading, copied literally rather than translated.
  # lang: ISO-639-1 code, or default. Here default REQUIRES an explicit --lang;
  #       language/lang frontmatter and the global language key are not consulted.
  # output: append updates the source; separate creates an external Markdown file.
  # file_suffix: external filename suffix, with no path separators.
  # Example local override: short: {enabled: true, lang: uk, output: separate}
  short: {}

  # Optional long overrides: enabled, heading, lang, output, file_suffix,
  # plus references.enabled, references.link_style, and references.display
  # (label, heading, timestamp, separator), with the meanings documented above.
  # Existing source IDs are checked; pipeline ID-generation flags are irrelevant
  # to this tool. References may require a source edit even with separate output.
  long: {}

  # Optional tool-specific LLM settings, recursively overriding global llm.
  # Configure provider and its nested model/temperature/top_p/retry/etc. here to
  # regenerate with a stronger model while retaining the cleanup pipeline model.
  # Example local override: llm: {gemini: {model: gemini-2.5-pro}}
  # --llm-provider and --model override the effective provider and model.
  llm: {}
  # Optional tool-specific global retry attempts and pause_seconds. The selected
  # provider's llm.<provider>.retry remains more specific, as in the pipeline.
  # --retry-attempts and --request-delay override effective request settings.
  retry: {}

  # Existing summaries are matched by type, language and output location.
  # Old tagged summaries without language conservatively match any language.
  # skip: retain matches and generate only missing types (no API call if all skip).
  # replace: regenerate one match; multiple matches require --target ID or all.
  # add: deliberately allow unlimited duplicates, including the same language.
  # error: reject conflicts before any LLM call. CLI: --on-existing.
  on_existing: skip

  legacy:
    # Exclude an unmarked summary tail from source by its first matching heading.
    # Everything from that heading to EOF is excluded; no tail segmentation.
    # Code examples and tagged summaries are ignored during heading detection.
    # CLI: --legacy-summary-detection / --no-legacy-summary-detection.
    enabled: true
    # Literal whole words/phrases in an ATX (#) or Setext heading. A local list
    # replaces this list. --legacy-summary-keyword may be repeated and also
    # replaces the configured list. Empty [] disables word matching.
    heading_words: [summary]
    # false matches Summary, SUMMARY, etc.; true uses the spelling above.
    # CLI: --legacy-case-sensitive / --legacy-ignore-case.
    case_sensitive: false

  source:
    # Filtering affects only the LLM source; original comments are preserved.
    # service: exclude diagnostic/edit comments, including unsure AND unsures,
    # STARTING/END, merged_terms and provider/model processing metadata.
    # all: exclude actual HTML comments; keep: preserve them.
    # Meaningful code examples are retained. Diagnostic-only fences are excluded
    # for service/all. YAML frontmatter is excluded and never supplies language.
    # Tagged summaries of every type/language are always excluded first.
    # CLI: --comments service|all|keep; inspect with --print-source.
    comments: service

  references:
    # Used only when long references are enabled and source headings lack IDs.
    # add: plan missing ^src-* / ^txt-* IDs with the shared heading renderer;
    #      preserve existing IDs and timestamp formats, and save IDs to source
    #      only after ALL requested summaries succeed (including external ones).
    # omit: warn and disable long references for this invocation.
    # error: fail before LLM calls. Duplicate IDs are always an error.
    # Source without any headings must be structured or use omit/no references.
    # CLI: --missing-ids add|omit|error; --no-long-summary-references disables
    # references explicitly. Dry-run reports the planned source edits.
    missing_ids: add

  backups:
    # Back up every existing source/output file that will change, not new files.
    # Copies retain original bytes and permissions. No backup is made by
    # --dry-run, --print-source, --list, --diff, skipped or failed generation.
    # CLI: --backup / --no-backup. Write rollback also works when this is false.
    enabled: true
    # Filename template beside each original; no directory components allowed.
    # {stem}: name without .md; {name}: full original filename;
    # {datetime}: UTC YYYY-MM-DD_HH-MM-SS-microseconds. Must end in .md.
    # Existing backup names cause an error rather than overwriting old copies.
    # CLI: --backup-filename. Default: original name - datetime - bak.md.
    filename: "{stem}-{datetime}-bak.md"

  external:
    # null writes beside the source. Otherwise use a directory path; $HOME/~
    # expand, and relative paths refer to the invocation directory. --outdir
    # overrides this value. Discovery checks only the source/output directories.
    # First names use file_suffix; additional languages/duplicates use .en/.en.2
    # before .md. Backlinks are relative to the actual external file location.
    directory: null

  # Optional positive maximum characters in the filtered source, including any
  # planned IDs. null imposes no local limit; provider context limits still apply.
  # Exceeding a limit is an error; source is never silently truncated.
  max_source_chars: null

# Paths to stopword lists (one per language)
parasites:
  ru: data/parasites_ru.txt
  uk: data/parasites_uk.txt
  en: data/parasites_en.txt
  de: data/parasites_de.txt

# Logging verbosity controls how much the pipeline prints:
#   - quiet : prints nothing, including errors.
#   - error : prints errors only.
#   - info  : concise progress and errors; no stack traces; never prints full
#             LLM prompts/responses. Suitable for normal runs.
#   - debug : adds diagnostics (provider, model, temperature/top_p, chunk/overlap info)
#             and stack traces on errors; still does NOT print full prompts/responses.
#   - trace : prints EVERYTHING relevant, including full LLM requests and responses
#             for chunks and summary. This can be large and may contain sensitive
#             content. Use only for troubleshooting.
# You can override this via CLI flags:
#   --log-level LEVEL -> sets any of the five levels
#   --debug  -> sets level=debug
#   --trace  -> sets level=trace (implies debug)
logging:
  level: info

# Multitrack workflows retain extracted audio/provider artifacts/source TXT.
# Only multitrack workflows honor this switch; standalone transcription always
# stops at merged TXT. CLI --cleanup / --stop-after-merge override it.
# Soon it will be deprecated option for testing multiline pipeline more preciese.
multitrack:
  stop_after_merge: false
